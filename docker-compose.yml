services:
  postgres:
    image: postgres:17
    container_name: quickfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickfi
      POSTGRES_USER: quickfi
      POSTGRES_PASSWORD: quickfi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: